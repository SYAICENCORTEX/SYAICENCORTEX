<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 28" width="100%" height="28">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="25%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F9E29D" stop-opacity="1" />
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="gemPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#7B1113" />
    </radialGradient>
  </defs>

  <style>
    .shimmer-line {
      stroke-dasharray: 60 240;
      animation: lineFlow 6s ease-in-out infinite alternate;
    }
    @keyframes lineFlow {
      0% { stroke-dashoffset: -100; }
      100% { stroke-dashoffset: 100; }
    }
    .rotating-star {
      animation: starRot 14s linear infinite;
      transform-origin: 400px 14px;
    }
    @keyframes starRot {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Base line -->
  <line x1="50" y1="14" x2="750" y2="14" stroke="url(#divGrad)" stroke-width="1.2" />
  <line x1="50" y1="14" x2="750" y2="14" stroke="#FFF3C4" stroke-width="1.6" class="shimmer-line" opacity="0.6" />

  <!-- Center Heraldic Knot & Rotating Diamond -->
  <g transform="translate(400, 14)">
    <g class="rotating-star">
      <polygon points="0,-8 7,0 0,8 -7,0" fill="url(#gemPulse)" stroke="#F9E29D" stroke-width="0.8" />
    </g>
    <circle cx="0" cy="0" r="2.5" fill="#FFF8E7" />
    
    <!-- Flanking Ornaments -->
    <circle cx="-18" cy="0" r="2.5" fill="#D4AF37" />
    <circle cx="18" cy="0" r="2.5" fill="#D4AF37" />
    <circle cx="-28" cy="0" r="1.5" fill="#AA820A" />
    <circle cx="28" cy="0" r="1.5" fill="#AA820A" />

    <polygon points="-42,-3 -36,0 -42,3 -48,0" fill="#C5A059" />
    <polygon points="42,-3 48,0 42,3 36,0" fill="#C5A059" />
  </g>
</svg>